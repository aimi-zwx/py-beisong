<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Py背诵">
<title>Python 函数背诵</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--sub:#6b7385;--ac:#3b6cf6;--acbg:#e8eefe;--ok:#1f9d55;--bad:#d9453d;--bd:#e3e6ee;--code:#f0f2f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--sub:#9aa1b3;--ac:#7c9cff;--acbg:#262d45;--ok:#4cc27e;--bad:#ff6b63;--bd:#2c303c;--code:#12141a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.name{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--ac);font-size:17px}
.sub{color:var(--sub);font-size:14px}
pre{background:var(--code);border-radius:8px;padding:8px 10px;margin:8px 0 0;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
input[type=search],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--sub);font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acbg);color:var(--ac);font-weight:600}
button.p{background:var(--ac);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}
.mini{padding:5px 10px;font-size:13px;flex:none}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acbg);color:var(--ac);margin-left:6px}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.flash .name{font-size:28px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-family:ui-monospace,Menlo,monospace}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border-radius:0;background:none;color:var(--sub);padding:12px 0;font-size:13px}
nav button.on{color:var(--ac)}
.big{font-size:32px;font-weight:700;color:var(--ac)}
.bar{height:8px;background:var(--code);border-radius:9px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
var RAW=[
"内置函数|print|输出内容到屏幕|print(*values, sep=' ', end='\\n')|print('a', 'b', sep='-')  # a-b",
"内置函数|input|读取用户输入，返回字符串|input(prompt)|name = input('名字：')",

"内置函数|type|返回对象的类型|type(obj)|type(3.5)  # float",
"内置函数|isinstance|判断对象是否属于某类型|isinstance(obj, type)|isinstance(5, int)  # True",
"内置函数|int|转换为整数|int(x, base=10)|int('42')  # 42",
"内置函数|float|转换为浮点数|float(x)|float('3.14')  # 3.14",
"内置函数|str|转换为字符串|str(obj)|str(100)  # '100'",
"内置函数|list|转换为列表|list(iterable)|list('abc')  # ['a','b','c']",

"内置函数|max|返回最大值|max(iterable, key=None)|max([3, 9, 2])  # 9",
"内置函数|min|返回最小值|min(iterable, key=None)|min([3, 9, 2])  # 2",
"内置函数|abs|返回绝对值|abs(x)|abs(-7)  # 7",
"内置函数|round|四舍五入到指定小数位|round(x, ndigits=0)|round(3.14159, 2)  # 3.14",

"内置函数|reversed|返回反向迭代器|reversed(seq)|list(reversed([1,2,3]))  # [3,2,1]",
"内置函数|enumerate|遍历时同时得到索引和元素|enumerate(iterable, start=0)|for i, v in enumerate(['a','b']): ...  # 0 a, 1 b",

"内置函数|all|全部为真才返回 True|all(iterable)|all([1, 1, 0])  # False",
"字符串|split|分割：按分隔符切开，第二个参数是切几次，默认全部分割|str.split(sep, maxsplit)|'a,b,c'.split(',')  # ['a','b','c']|结果是列表，不是字符串，不能直接当字符串用",
"字符串|join|拼接：用指定字符串把序列里的元素连起来|sep.join(iterable)|'-'.join(['a','b'])  # 'a-b'|元素必须都是字符串，是 split 的反操作",
"字符串|strip|去空白：默认去掉两端空白，也可指定要去掉的字符|str.strip(chars)|'  hi  '.strip()  # 'hi'|lstrip 去左端，rstrip 去右端；只处理两端，中间的不动",
"字符串|replace|替换：把旧字符换成新字符，第三个参数是替换几次，不写默认全部|str.replace(old, new, count)|'aab'.replace('a','x')  # 'xxb'|不会修改原字符串，而是返回新字符串，要用变量接收",
"字符串|find|查找子串位置，找不到返回 -1|str.find(sub, start, end)|'hello'.find('l')  # 2",
"字符串|startswith|判断是否以某前缀开头|str.startswith(prefix)|'hello'.startswith('he')  # True",
"字符串|upper|全部转为大写|str.upper()|'abc'.upper()  # 'ABC'|比较时不分大小写，可以先都转成 upper 或 lower",

"字符串|rstrip|只去掉右端的空白或指定字符|str.rstrip(chars)|'hi  '.rstrip()  # 'hi'|lstrip 去左端，strip 去两端",
"字符串|capitalize|只把整个字符串的首字母变大写|str.capitalize()|'hello world'.capitalize()  # 'Hello world'|和 title 的区别：title 是每个单词首字母都大写",
"字符串|swapcase|大小写互换|str.swapcase()|'aBc'.swapcase()  # 'AbC'|",
"字符串|center|居中对齐，两侧用 fill 补足到宽度 w|str.center(w, fill)|'hi'.center(6, '*')  # '**hi**'|fill 不写默认用空格",
"字符串|ljust|左对齐，右侧补足到宽度 w|str.ljust(w, fill)|'hi'.ljust(5, '-')  # 'hi---'|",
"字符串|rjust|右对齐，左侧补足到宽度 w|str.rjust(w, fill)|'hi'.rjust(5, '-')  # '---hi'|",
"字符串|isalnum|判断是否全是字母或数字|str.isalnum()|'abc123'.isalnum()  # True|有空格或符号就是 False",

"字符串|+ 拼接|用加号连接两个字符串|a + b|'ab' + 'cd'  # 'abcd'|只能连接字符串，数字要先用 str() 转换",

"字符串|format|格式化字符串|str.format(*args, **kwargs)|'{}今年{}岁'.format('小明', 18)",

"列表|pop|删除并返回指定位置元素，默认最后一个|list.pop(index=-1)|a=[1,2,3]; a.pop()  # 返回 3",
"列表|remove|删除第一个匹配的值|list.remove(x)|a=[1,2,2]; a.remove(2)  # [1,2]",
"列表|sort|原地排序，返回 None|list.sort(key=None, reverse=False)|a=[3,1,2]; a.sort()  # [1,2,3]",
"列表|index|返回元素第一次出现的位置|list.index(x)|[5,6,7].index(6)  # 1",
"列表|count|统计元素出现次数|list.count(x)|[1,2,2].count(2)  # 2",

"字典|keys|返回所有键|dict.keys()|list({'a':1}.keys())  # ['a']",
"字典|values|返回所有值|dict.values()|list({'a':1}.values())  # [1]",
"字典|items|返回所有 (键, 值) 对|dict.items()|for k, v in d.items(): ...",
"字典|update|用另一个字典更新|dict.update(other)|d={'a':1}; d.update({'b':2})",
"字典|pop|删除指定键并返回其值|dict.pop(key, default)|{'a':1}.pop('a')  # 1",
"字典|setdefault|键不存在时设置默认值并返回|dict.setdefault(key, default)|d.setdefault('n', []).append(1)",
"集合|add|添加元素|set.add(x)|s={1}; s.add(2)  # {1,2}",
"集合|union|并集|a.union(b)|{1,2}.union({2,3})  # {1,2,3}|也可以用竖线运算符连接两个集合",
"集合|intersection|交集|a.intersection(b) 或 a & b|{1,2}.intersection({2,3})  # {2}",
"集合|difference|差集|a.difference(b) 或 a - b|{1,2}.difference({2,3})  # {1}",
"文件操作|open|打开文件，推荐配合 with 使用|open(file, mode='r', encoding=None)|with open('a.txt', encoding='utf-8') as f: ...",
"文件操作|read|读取全部内容|f.read(size=-1)|text = f.read()",
"文件操作|readline|读取一行|f.readline()|line = f.readline()",
"文件操作|readlines|读取所有行，返回列表|f.readlines()|lines = f.readlines()",
"文件操作|write|写入字符串|f.write(s)|f.write('hello\\n')",
"常用模块|random.randint|返回 a 到 b 之间的随机整数，含两端|random.randint(a, b)|random.randint(1, 6)",
"常用模块|random.choice|从序列中随机选一个|random.choice(seq)|random.choice(['a','b','c'])",
"常用模块|math.sqrt|平方根|math.sqrt(x)|math.sqrt(16)  # 4.0",
"常用模块|os.listdir|列出目录下的文件名|os.listdir(path='.')|os.listdir('.')",
"常用模块|time.sleep|暂停指定秒数|time.sleep(seconds)|time.sleep(1.5)",
"内置函数|dict|创建字典或转换为字典|dict(iterable) / dict(a=1)|dict(zip(['a','b'], [1,2]))  # {'a':1,'b':2}|zip 配合 dict 可以把两个列表合成字典",
"内置函数|set|转换为集合，自动去重|set(iterable)|set([1,1,2])  # {1,2}|空集合必须写 set()，{} 表示空字典",
"内置函数|tuple|转换为元组|tuple(iterable)|tuple([1,2])  # (1,2)|元组创建后不能修改",
"内置函数|bool|转换为布尔值|bool(x)|bool([])  # False|0、空字符串、空列表、None 都是 False",
"内置函数|ord|字符转对应的整数编码|ord(c)|ord('A')  # 65|和 chr 互为反函数",
"内置函数|chr|整数编码转对应字符|chr(i)|chr(65)  # 'A'|和 ord 互为反函数",
"内置函数|pow|幂运算|pow(x, y, mod=None)|pow(2, 10)  # 1024|等价于 2 ** 10",
"内置函数|divmod|同时返回商和余数|divmod(a, b)|divmod(7, 2)  # (3, 1)|常用于时间换算",
"内置函数|dir|列出对象的所有属性和方法|dir(obj)|dir(str)|忘记方法名时很好用",
"内置函数|help|查看帮助文档|help(obj)|help(str.split)|退出帮助界面按 q",
"内置函数|eval|把字符串当表达式执行|eval(expr)|eval('1+2')  # 3|不要对不可信输入使用，有安全风险",
"内置函数|next|取迭代器的下一个元素|next(it, default)|next(iter([1,2]))  # 1|迭代器取完会报 StopIteration，传 default 可避免",
"字符串|count|统计子串出现次数|str.count(sub)|'banana'.count('a')  # 3|",
"字符串|index|查找子串位置，找不到报错|str.index(sub)|'abc'.index('c')  # 2|find 找不到返回 -1，index 抛 ValueError",
"字符串|endswith|判断是否以某后缀结尾|str.endswith(suffix)|'a.py'.endswith('.py')  # True|可传元组同时判断多个后缀",
"字符串|lstrip|只去掉左侧空白或指定字符|str.lstrip(chars=None)|'  hi'.lstrip()  # 'hi'|右侧对应 rstrip",
"字符串|isdigit|判断是否全是数字字符|str.isdigit()|'123'.isdigit()  # True|'-1' 和 '1.5' 返回 False",
"字符串|isalpha|判断是否全是字母|str.isalpha()|'abc'.isalpha()  # True|汉字也返回 True",
"字符串|title|每个单词首字母大写|str.title()|'hello world'.title()  # 'Hello World'|",
"字符串|zfill|左侧补零到指定宽度|str.zfill(width)|'7'.zfill(3)  # '007'|",
"字符串|splitlines|按行切分成列表|str.splitlines()|'a\\nb'.splitlines()  # ['a','b']|比 split('\\n') 更稳妥",
"字符串|f-string|在字符串中直接嵌入变量和表达式|f'文本{变量:格式}'|name='小明'; f'{name}得了{95.5:.1f}分'|3.6 以上版本最推荐的格式化方式",
"字符串|切片|按范围取子串，左闭右开|seq[start:stop:step]|'abcde'[1:4]  # 'bcd'|[::-1] 可反转，列表和元组也适用",

"列表|reverse|原地反转，返回 None|list.reverse()|a=[1,2,3]; a.reverse()  # [3,2,1]|reversed() 则返回新的迭代器",
"列表|del|按位置删除元素或整个变量|del a[i]|a=[1,2,3]; del a[0]  # [2,3]|是语句，不是函数，不加括号",

"字典|popitem|删除并返回最后插入的键值对|dict.popitem()|{'a':1,'b':2}.popitem()  # ('b', 2)|3.7 起按插入顺序，字典为空会报错",
"字典|clear|清空字典|dict.clear()|d.clear()  # {}|",

"字典|字典推导式|用一行生成新字典|{k: v for k, v in 序列}|{x: x*x for x in range(3)}  # {0:0,1:1,2:4}|",

"文件操作|close|关闭文件，释放资源|f.close()|f = open('a.txt'); f.close()|用 with 语句会自动关闭，更安全",

"异常处理|raise|主动抛出异常|raise 异常类型('信息')|raise ValueError('年龄不能为负')|",

"函数与类|class|定义类|class 类名:\n    def __init__(self, ...):|class Dog:\n    def __init__(self, name):\n        self.name = name|类名习惯用大驼峰，方法第一个参数是 self",
"函数与类|super|调用父类的方法|super().方法名(...)|super().__init__(name)|子类重写 __init__ 时别忘了调用父类的",
"常用模块|random.shuffle|原地打乱列表|random.shuffle(lst)|random.shuffle(a)|返回 None，直接改动原列表",
"常用模块|random.random|返回 0 到 1 之间的随机小数|random.random()|random.random()  # 如 0.37|",
"常用模块|math.ceil|向上取整|math.ceil(x)|math.ceil(3.2)  # 4|向下取整是 math.floor",
"常用模块|math.floor|向下取整|math.floor(x)|math.floor(3.8)  # 3|",
"常用模块|os.path.exists|判断路径是否存在|os.path.exists(path)|os.path.exists('a.txt')  # True 或 False|",
"常用模块|os.path.join|拼接路径|os.path.join(a, b, ...)|os.path.join('dir', 'a.txt')|比手写斜杠更能跨系统",
"常用模块|os.getcwd|返回当前工作目录|os.getcwd()|os.getcwd()|",
"常用模块|time.time|返回当前时间戳（秒）|time.time()|start = time.time()|相减可统计程序耗时",
"常用模块|datetime.now|返回当前日期时间|datetime.datetime.now()|datetime.datetime.now().strftime('%Y-%m-%d')|strftime 用来把时间格式化为字符串",
"常用模块|json.dumps|Python 对象转 JSON 字符串|json.dumps(obj, ensure_ascii=False)|json.dumps({'a': 1})  # '{\"a\": 1}'|含中文时要加 ensure_ascii=False",
"常用模块|json.loads|JSON 字符串转 Python 对象|json.loads(s)|json.loads('{\"a\": 1}')  # {'a': 1}|读写文件用 json.load / json.dump",
"常用模块|Counter|统计元素出现次数|collections.Counter(iterable)|Counter('aab')  # {'a':2,'b':1}|most_common(n) 可取出现最多的 n 个"
];
var D=RAW.map(function(r,i){var p=r.split("|");return{id:p[0]+p[1],cat:p[0],name:p[1],desc:p[2],syn:p[3],ex:p[4],note:p[5]||""}});
var CATS=["全部"].concat(D.map(function(d){return d.cat}).filter(function(c,i,a){return a.indexOf(c)===i}));
var DAYS=[0,1,2,4,7,15,30],DAY=86400000;
function note(d){return d.note?'<div class="sub" style="margin-top:8px">💡 '+esc(d.note)+'</div>':""}
var S={};try{S=JSON.parse(localStorage.getItem("pyc")||"{}")}catch(e){}
function save(){try{localStorage.setItem("pyc",JSON.stringify(S))}catch(e){}}
function st(id){return S[id]||(S[id]={box:-1,due:0,fav:false,hard:false})}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function mark(id,known){var s=st(id);if(known){s.box=Math.min(s.box+1,6);s.hard=s.box<2&&s.hard;s.due=Date.now()+DAYS[s.box]*DAY}else{s.box=0;s.hard=true;s.due=Date.now()}save()}
function isDue(id){var s=S[id];return !s||s.box<0||s.due<=Date.now()}
var tab="browse",cat="全部",q="",open={},deck=[],di=0,flip=false,mode="due",qz=null;
var TABS=[["browse","浏览"],["flash","闪卡"],["quiz","测验"],["stat","进度"]];
function nav(){document.getElementById("nav").innerHTML=TABS.map(function(t){return'<button class="'+(tab==t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("")}
document.getElementById("nav").onclick=function(e){var t=e.target.dataset.t;if(t){tab=t;if(t=="flash")buildDeck();if(t=="quiz")qz=null;render()}};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function buildDeck(){var l=D.filter(function(d){var s=S[d.id]||{};return mode=="all"||(mode=="due"&&isDue(d.id))||(mode=="hard"&&s.hard)||(mode=="fav"&&s.fav)});deck=shuffle(l);di=0;flip=false}
function render(){nav();var a=document.getElementById("app");a.innerHTML=({browse:vBrowse,flash:vFlash,quiz:vQuiz,stat:vStat})[tab]();window.scrollTo(0,0);bind()}
function vBrowse(){
 var l=D.filter(function(d){return(cat=="全部"||d.cat==cat)&&(!q||(d.name+d.desc).toLowerCase().indexOf(q.toLowerCase())>=0)});
 return'<h1>Python 函数</h1><input type="search" id="q" placeholder="搜索函数名或作用" value="'+esc(q)+'"><div class="chips">'+CATS.map(function(c){return'<span class="chip '+(c==cat?"on":"")+'" data-c="'+c+'">'+c+'</span>'}).join("")+'</div><div id="list">'+
 (l.length?l.map(function(d){var s=S[d.id]||{};return'<div class="card"><div data-o="'+d.id+'"><span class="name">'+esc(d.name)+'</span>'+(s.fav?" ⭐":"")+(s.hard?'<span class="tag">不熟</span>':"")+'<div class="sub">'+esc(d.desc)+'</div></div>'+(open[d.id]?'<pre>'+esc(d.syn)+'</pre><pre>'+esc(d.ex)+'</pre>'+note(d)+'<div class="row"><button class="mini" data-f="'+d.id+'">'+(s.fav?"取消收藏":"⭐ 收藏")+'</button><button class="mini" data-h="'+d.id+'">'+(s.hard?"标记已熟":"标记不熟")+'</button></div>':"")+'</div>'}).join(""):'<p class="sub">没有找到匹配的函数</p>')+'</div>';
}
function vFlash(){
 var sel='<select id="mode">'+[["due","今日待复习"],["hard","不熟的"],["fav","收藏的"],["all","全部"]].map(function(m){return'<option value="'+m[0]+'"'+(m[0]==mode?" selected":"")+'>'+m[1]+'</option>'}).join("")+'</select>';
 if(!deck.length)return'<h1>闪卡</h1>'+sel+'<div class="card sub">这个范围里没有卡片了 🎉 换个范围试试。</div>';
 if(di>=deck.length)return'<h1>闪卡</h1>'+sel+'<div class="card flash"><div class="big">完成 ✅</div><p class="sub">本轮 '+deck.length+' 张已全部过完</p><button class="p" id="again">再来一轮</button></div>';
 var d=deck[di];
 return'<h1>闪卡 '+(di+1)+'/'+deck.length+'</h1>'+sel+'<div class="card flash" id="fc">'+(flip?'<div class="name">'+esc(d.name)+'</div><div style="margin:8px 0">'+esc(d.desc)+'</div><pre style="text-align:left;width:100%">'+esc(d.syn)+'</pre><pre style="text-align:left;width:100%">'+esc(d.ex)+'</pre>'+note(d):'<div class="sub">这个函数的作用是？</div><div class="name" style="margin-top:8px">'+esc(d.name)+'</div><div class="sub" style="margin-top:16px">点击翻面（先回忆再看）</div>')+'</div>'+(flip?'<div class="row"><button class="bad" id="no">不熟</button><button class="ok" id="yes">记住了</button></div>':'');
}
function newQuiz(){var pool=shuffle(D).slice(0,10);qz={i:0,score:0,ans:null,qs:pool.map(function(d){var o=shuffle(D.filter(function(x){return x.id!=d.id})).slice(0,3).concat([d]);return{d:d,o:shuffle(o)}})}}
function vQuiz(){
 if(!qz)return'<h1>测验</h1><div class="card"><p>共 10 题：看到函数的作用，选出正确的函数名。答错的会自动标记为“不熟”。</p><button class="p" id="start">开始测验</button></div>';
 if(qz.i>=qz.qs.length)return'<h1>测验结束</h1><div class="card flash"><div class="big">'+qz.score+' / '+qz.qs.length+'</div><p class="sub">答错的函数已加入“不熟”</p><button class="p" id="start">再测一次</button></div>';
 var q=qz.qs[qz.i];
 return'<h1>测验 '+(qz.i+1)+'/'+qz.qs.length+'</h1><div class="card"><div>'+esc(q.d.desc)+'</div><pre>'+esc(q.d.syn.replace(q.d.name,"???"))+'</pre>'+q.o.map(function(o){var c="";if(qz.ans){if(o.id==q.d.id)c="right";else if(o.id==qz.ans)c="wrong"}return'<button class="opt '+c+'" data-a="'+o.id+'">'+esc(o.name)+'</button>'}).join("")+'</div>'+(qz.ans?'<button class="p" style="width:100%" id="nx">下一题</button>':"");
}
function vStat(){
 var n=D.length,learned=0,hard=0,fav=0,due=0,mastered=0;D.forEach(function(d){var s=S[d.id]||{};if(s.box>=0)learned++;if(s.box>=4)mastered++;if(s.hard)hard++;if(s.fav)fav++;if(isDue(d.id)&&s.box>=0)due++});
 var cs=CATS.slice(1).map(function(c){var l=D.filter(function(d){return d.cat==c}),k=l.filter(function(d){return(S[d.id]||{}).box>=2}).length;return'<div>'+c+' <span class="sub">'+k+'/'+l.length+'</span></div><div class="bar"><i style="width:'+k/l.length*100+'%"></i></div>'}).join("");
 return'<h1>学习进度</h1><div class="card"><div class="row" style="text-align:center"><div><div class="big">'+learned+'</div><div class="sub">已学 / '+n+'</div></div><div><div class="big">'+due+'</div><div class="sub">今日待复习</div></div><div><div class="big">'+hard+'</div><div class="sub">不熟</div></div></div></div><div class="card"><b>各分类掌握度</b><div class="sub" style="margin-bottom:8px">答对两次以上算掌握</div>'+cs+'</div><div class="card sub">复习间隔：1、2、4、7、15、30 天。记住了就拉长间隔，不熟就从头来。每天打开“闪卡 → 今日待复习”即可。<div class="row"><button class="mini" id="reset">清空学习记录</button></div></div>';
}
function bind(){
 var $=function(i){return document.getElementById(i)};
 var qi=$("q");if(qi){var comp=false;var upd=function(){q=qi.value;var t=document.createElement("div");t.innerHTML=vBrowse();$("list").innerHTML=t.querySelector("#list").innerHTML;bindList()};qi.oninput=function(){if(!comp)upd()};qi.oncompositionstart=function(){comp=true};qi.oncompositionend=function(){comp=false;upd()}}
 document.querySelectorAll("[data-c]").forEach(function(e){e.onclick=function(){cat=e.dataset.c;render()}});
 function bindList(){document.querySelectorAll("[data-o]").forEach(function(e){e.onclick=function(){open[e.dataset.o]=!open[e.dataset.o];var y=scrollY;render();scrollTo(0,y)}});
 document.querySelectorAll("[data-f]").forEach(function(e){e.onclick=function(){var s=st(e.dataset.f);s.fav=!s.fav;save();var y=scrollY;render();scrollTo(0,y)}});
 document.querySelectorAll("[data-h]").forEach(function(e){e.onclick=function(){var s=st(e.dataset.h);s.hard=!s.hard;save();var y=scrollY;render();scrollTo(0,y)}});}bindList();
 var m=$("mode");if(m)m.onchange=function(){mode=m.value;buildDeck();render()};
 if($("fc"))$("fc").onclick=function(){if(!flip){flip=true;render()}};
 if($("yes"))$("yes").onclick=function(){mark(deck[di].id,true);di++;flip=false;render()};
 if($("no"))$("no").onclick=function(){mark(deck[di].id,false);di++;flip=false;render()};
 if($("again"))$("again").onclick=function(){buildDeck();render()};
 if($("start"))$("start").onclick=function(){newQuiz();render()};
 document.querySelectorAll("[data-a]").forEach(function(e){e.onclick=function(){if(qz.ans)return;var d=qz.qs[qz.i].d;qz.ans=e.dataset.a;if(qz.ans==d.id){qz.score++;mark(d.id,true)}else mark(d.id,false);render()}});
 if($("nx"))$("nx").onclick=function(){qz.i++;qz.ans=null;render()};
 if($("reset"))$("reset").onclick=function(){if(confirm("确定清空所有学习记录？")){S={};save();render()}};
}
render();
</script>
</body>
</html>
