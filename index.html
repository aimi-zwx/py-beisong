<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日 AI 数码简报</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>每日 AI 数码简报</h1><p class="sub" id="updated">每天自动汇总中文科技媒体的 AI 与数码新闻</p></div>
    <button class="btn" id="theme" type="button">切换深色</button>
  </header>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="搜索标题或摘要（会搜索所有往期）" aria-label="搜索新闻">
    <select class="btn" id="src" aria-label="按来源筛选"></select>
    <div class="cats" id="cats"></div>
  </div>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="往期日期"></nav>
    <main class="feed" id="feed"><p class="empty">加载中…</p></main>
  </div>
  <footer>新闻版权归原站所有，本站只展示标题和摘要，点击会跳转到原文。收藏和已读只保存在你当前浏览器里。</footer>
</div>
<script src="app.js"></script>
</body>
</html>
